<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRACE BENCH: Kuaishou GameMind Lab</title>
    <meta http-equiv="refresh" content="0; url=/projects/trace_bench/" />
    <meta
      name="description"
      content="TRACE BENCH has moved to /projects/trace_bench/. Redirecting."
    />
    <style>
      :root {
        --bg: #f4ede2;
        --paper: #fffaf1;
        --text: #2b2118;
        --muted: #746557;
        --accent: #a94d2f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: var(--text);
        background: var(--bg);
        font-family: Georgia, 'Noto Serif SC', serif;
      }
      main {
        width: min(520px, 100%);
        padding: 34px;
        background: var(--paper);
        border: 1px solid rgba(72, 54, 38, 0.18);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(43, 33, 24, 0.1);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: clamp(1.7rem, 6vw, 2.6rem);
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        color: var(--accent);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TRACE BENCH</h1>
      <p>
        Redirecting to the project page. If the redirect does not start,
        <a href="/projects/trace_bench/">open TRACE BENCH</a>
        .
      </p>
    </main>
    <script>
      window.location.replace('/projects/trace_bench/');
    </script>
  </body>
</html>
